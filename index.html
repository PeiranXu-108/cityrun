<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>城市酷跑 City Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Russo+One&family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: full-bleed WebGL canvas; HUD and menus float above it as glassy arcade panels. Dark, single-theme by design. */
:root {
  color-scheme: dark;
  --bg: #07060f;
  --ink: #f6f3ff;
  --muted: #b2abd6;
  --panel: rgba(13, 11, 28, 0.66);
  --panel-solid: #120f26;
  --line: rgba(255, 255, 255, 0.14);
  --accent: #ff3df0;
  --accent2: #00e5ff;
  --gold: #ffd23d;
  --danger: #ff3355;
  --ok: #39ff88;
  --f-display: "Russo One", "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-cn: "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Chakra Petch", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); }
body { touch-action: none; user-select: none; -webkit-user-select: none; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 2px solid var(--accent2); outline-offset: 3px; }

#ui { position: fixed; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; pointer-events: auto; padding: calc(env(safe-area-inset-top, 0px) + 16px) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 16px); }

/* ---------- shared bits ---------- */
.coin-ico { width: 1.05em; height: 1.05em; border-radius: 50%; display: inline-block; flex: none;
  background: radial-gradient(circle at 35% 35%, #fff3b0, var(--gold) 45%, #d48a00 75%); box-shadow: 0 0 10px rgba(255, 200, 40, .7); position: relative; }
.coin-ico::after { content: ""; position: absolute; inset: 32%; border-radius: 2px; background: rgba(120, 60, 0, .55); }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-weight: 700; font-variant-numeric: tabular-nums; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform .15s, border-color .15s; }
.icon-btn:hover { transform: translateY(-2px); border-color: var(--accent2); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.off { opacity: .45; }
.label { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.btn { padding: 14px 22px; border-radius: 16px; font-weight: 700; font-size: 16px; background: var(--panel); border: 1px solid var(--line); transition: transform .15s, box-shadow .15s, border-color .15s; }
.btn:hover { transform: translateY(-2px); border-color: var(--accent2); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; color: #0b0718; box-shadow: 0 8px 30px color-mix(in srgb, var(--accent) 45%, transparent); }
.btn.primary:hover { box-shadow: 0 10px 40px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

/* ---------- loading ---------- */
#loading { display: grid; place-items: center; align-content: center; gap: 22px; background: radial-gradient(ellipse at 50% 60%, #1d1240, var(--bg) 70%); }
.logo { font-family: var(--f-cn); font-size: clamp(48px, 10vw, 96px); line-height: 1; letter-spacing: .04em; text-shadow: 0 0 24px var(--accent), 0 0 60px color-mix(in srgb, var(--accent) 50%, transparent); }
.logo small { display: block; font-family: var(--f-display); font-size: .3em; letter-spacing: .5em; text-align: center; color: var(--accent2); text-shadow: 0 0 14px var(--accent2); margin-top: 10px; }
.bar { width: min(320px, 70vw); height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .25s; }
#loadMsg { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .1em; }

/* ---------- menu ---------- */
#menu { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); grid-template-rows: auto 1fr auto auto; gap: 16px 24px;
  background: linear-gradient(90deg, rgba(5, 4, 14, .75) 0%, rgba(5, 4, 14, .15) 45%, rgba(5, 4, 14, 0) 60%, rgba(5, 4, 14, .35) 100%), linear-gradient(0deg, rgba(5, 4, 14, .8), transparent 38%); }
.menu-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
.brand .cn { font-family: var(--f-cn); font-size: 34px; line-height: 1; text-shadow: 0 0 18px var(--accent); }
.brand .en { font-family: var(--f-display); font-size: 13px; letter-spacing: .42em; color: var(--accent2); }
.tools { display: flex; gap: 8px; }
.city-head { grid-column: 1; align-self: center; min-width: 0; }
.city-head .en { font-family: var(--f-display); font-size: clamp(38px, 6.4vw, 96px); line-height: .95; letter-spacing: .02em; white-space: nowrap; padding-bottom: .06em;
  background: linear-gradient(180deg, #fff 20%, var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px color-mix(in srgb, var(--accent) 55%, transparent)); }
.city-head .cn { font-family: var(--f-cn); font-size: clamp(26px, 3.4vw, 44px); margin-top: 8px; color: var(--accent); text-shadow: 0 0 16px var(--accent); }
.best-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.side { grid-column: 2; grid-row: 2 / 4; align-self: center; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.char-row { display: flex; align-items: center; gap: 10px; }
.char-row .arrow { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); font-size: 22px; display: grid; place-items: center; flex: none; }
.char-row .arrow:hover { border-color: var(--accent2); }
.char-meta { flex: 1; min-width: 0; text-align: center; }
#charName { font-family: var(--f-cn); font-size: 28px; line-height: 1.1; }
#charName small { font-family: var(--f-display); font-size: 12px; letter-spacing: .3em; color: var(--accent2); margin-left: 6px; }
#charDesc { color: var(--muted); font-size: 13px; margin-top: 4px; }
#charBuy { margin-top: 10px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.2); }
.dots i.on { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
.missions h3 { margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
.missions h3 span { font-size: 12px; color: var(--gold); font-variant-numeric: tabular-nums; }
.mission { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
.mission:first-of-type { border-top: 0; }
.mission .prog { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
.mission .prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.mission .num { color: var(--muted); font-variant-numeric: tabular-nums; }
.mission.done { color: var(--ok); }
.city-nav { grid-column: 1; grid-row: 3; align-self: end; display: flex; align-items: center; gap: 10px; min-width: 0; }
.city-nav .arrow { width: 40px; height: 64px; border-radius: 14px; border: 1px solid var(--line); background: rgba(10, 8, 26, .55); font-size: 26px; display: grid; place-items: center; flex: none; }
.city-nav .arrow:hover { border-color: var(--accent2); }
.cities { --per: 3; --gap: 12px; --u: calc(100% / (var(--per) + 1)); flex: 1; min-width: 0; overflow: hidden; padding: 10px 0; margin: -10px 0; cursor: grab; touch-action: pan-y;
  -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,.08), rgba(0,0,0,.5) calc(var(--u) / 2 - var(--gap) / 2), #000 calc(var(--u) / 2), #000 calc(100% - var(--u) / 2), rgba(0,0,0,.5) calc(100% - var(--u) / 2 + var(--gap) / 2), rgba(0,0,0,.08));
  mask-image: linear-gradient(90deg, rgba(0,0,0,.08), rgba(0,0,0,.5) calc(var(--u) / 2 - var(--gap) / 2), #000 calc(var(--u) / 2), #000 calc(100% - var(--u) / 2), rgba(0,0,0,.5) calc(100% - var(--u) / 2 + var(--gap) / 2), rgba(0,0,0,.08)); }
.cities.drag { cursor: grabbing; }
.city-track { --off: 0; display: flex; gap: var(--gap); transform: translateX(calc(100% / (var(--per) + 1) * (var(--off) - var(--per) - .5) + var(--gap) / 2)); }
.city-track.anim { transition: transform .38s cubic-bezier(.2,.8,.2,1); }
.city-track .city { flex: 0 0 calc(100% / (var(--per) + 1) - var(--gap)); min-width: 0; }
.cities.drag .city { pointer-events: none; }
.city { position: relative; text-align: left; border-radius: 18px; padding: 14px 14px 12px; min-height: 112px; overflow: hidden; border: 1px solid var(--line); transition: transform .18s, border-color .18s, box-shadow .18s; isolation: isolate; }
.city::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--grad); opacity: .85; }
.city::after { content: ""; position: absolute; inset: auto 0 0 0; height: 46%; z-index: -1; background: linear-gradient(0deg, rgba(5,4,14,.85), transparent); }
.city:hover { transform: translateY(-3px); }
.city.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 10px 34px color-mix(in srgb, var(--c) 45%, transparent); }
.city .cn { font-family: var(--f-cn); font-size: 26px; line-height: 1; display: block; }
.city .en { font-family: var(--f-display); font-size: 10px; letter-spacing: .28em; opacity: .85; display: block; margin-top: 4px; }
.city.long .cn { font-size: 21px; }   /* a five-character name such as 伊斯坦布尔 */
.city .tag { font-size: 12px; margin-top: 18px; display: block; color: #fff; opacity: .9; }
.city .best { position: absolute; top: 12px; right: 12px; font-size: 11px; font-variant-numeric: tabular-nums; opacity: .8; }
.play-wrap { grid-column: 2; grid-row: 4; display: flex; flex-direction: column; gap: 8px; }
#playBtn { width: 100%; padding: 20px; font-size: 22px; font-family: var(--f-cn); letter-spacing: .2em; border-radius: 20px; }
.keys { text-align: center; font-size: 12px; color: var(--muted); }
.keys kbd { font-family: var(--f-body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; margin: 0 2px; color: var(--ink); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; padding: calc(env(safe-area-inset-top, 0px) + 14px) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 14px); }
.hud-top { display: flex; align-items: flex-start; gap: 12px; }
#pauseBtn { pointer-events: auto; }
.score-box { margin-left: auto; text-align: right; }
#score { font-family: var(--f-display); font-size: clamp(30px, 5vw, 46px); line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 70%, transparent); }
.score-sub { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
#mult { color: var(--gold); }
#mult.x2 { color: #0b0718; background: var(--gold); border-color: transparent; box-shadow: 0 0 16px var(--gold); }
.coin-box { margin-top: 8px; display: flex; justify-content: flex-end; }
.powers { position: absolute; left: var(--gutter); top: calc(env(safe-area-inset-top, 0px) + 72px); display: flex; flex-direction: column; gap: 10px; }
.pw { --p: 1; --c: #fff; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--c) calc(var(--p) * 360deg), rgba(255,255,255,.12) 0); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 50%, transparent); }
.pw::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--panel-solid); }
.pw svg, .pw b { position: relative; width: 24px; height: 24px; color: var(--c); font-family: var(--f-display); font-size: 15px; display: grid; place-items: center; }
.pw.ending { animation: blink .3s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.toasts { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(90vw, 520px); }
.toast { font-family: var(--f-cn); font-size: clamp(22px, 3.6vw, 34px); color: #fff; text-shadow: 0 0 14px var(--c, var(--accent)), 0 0 32px var(--c, var(--accent)); animation: pop 1.4s ease-out forwards; text-align: center; white-space: nowrap; }
.toast small { display: block; font-family: var(--f-body); font-size: .5em; letter-spacing: .12em; color: var(--ink); opacity: .85; }
@keyframes pop { 0% { opacity: 0; transform: scale(.6) translateY(10px); } 12% { opacity: 1; transform: scale(1.12); } 22% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
.city-banner { position: absolute; inset: 34% 0 auto 0; text-align: center; opacity: 0; pointer-events: none; }
.city-banner.go { animation: banner 2.6s cubic-bezier(.2,.8,.2,1) forwards; }
.city-banner .en { font-family: var(--f-display); font-size: clamp(44px, 10vw, 120px); line-height: .9; letter-spacing: .06em; color: #fff; text-shadow: 0 0 30px var(--accent), 0 0 80px var(--accent); }
.city-banner .cn { font-family: var(--f-cn); font-size: clamp(22px, 4vw, 40px); color: var(--accent2); margin-top: 10px; letter-spacing: .4em; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.4); letter-spacing: .5em; filter: blur(8px); } 15% { opacity: 1; transform: scale(1); filter: blur(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(.96); } }
.chase-warn { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18%); transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; font-weight: 700;
  background: color-mix(in srgb, var(--danger) 85%, transparent); color: #fff; box-shadow: 0 0 30px var(--danger); opacity: 0; transition: opacity .2s; white-space: nowrap; }
.chase-warn.on { opacity: 1; animation: blink .5s steps(2) infinite; }
.hint { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%); color: var(--ink); font-size: 14px; opacity: 0; transition: opacity .6s; text-align: center; white-space: nowrap; }
.hint.on { opacity: .9; }
.place { position: absolute; left: var(--gutter); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 12px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; pointer-events: none; }
.place.go { animation: place 4.2s ease forwards; }
.place svg { width: 26px; height: 26px; color: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
.place b { display: block; font-family: var(--f-cn); font-size: 22px; line-height: 1.1; font-weight: 400; }
.place small { display: block; font-family: var(--f-display); font-size: 10px; letter-spacing: .26em; color: var(--muted); margin-top: 3px; }
@keyframes place { 0% { opacity: 0; transform: translateX(-24px); } 10% { opacity: 1; transform: none; } 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(-8px); } }
.vignette-hit { position: absolute; inset: 0; box-shadow: inset 0 0 120px 30px rgba(255, 40, 60, .55); opacity: 0; transition: opacity .3s; }
.vignette-hit.on { opacity: 1; }

/* ---------- modals ---------- */
.modal { display: grid; place-items: center; background: rgba(5, 4, 14, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.sheet { width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 26px; padding: 26px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow: auto; }
.sheet h2 { margin: 0; font-family: var(--f-cn); font-size: 40px; text-align: center; text-shadow: 0 0 20px var(--accent); line-height: 1.1; }
.sheet h2 small { display: block; font-family: var(--f-display); font-size: 12px; letter-spacing: .4em; color: var(--accent2); margin-top: 6px; text-shadow: none; }
.sheet .row { display: flex; gap: 10px; }
.sheet .row .btn { flex: 1; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: rgba(255,255,255,.05); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; margin-top: 4px; }
.stat.big { grid-column: 1 / -1; text-align: center; }
.stat.big b { font-size: 48px; text-shadow: 0 0 20px var(--accent); }
.record { align-self: center; padding: 6px 14px; border-radius: 999px; background: var(--gold); color: #1a1000; font-weight: 700; letter-spacing: .1em; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); box-shadow: 0 0 24px var(--gold); } }
.ring { width: 150px; height: 150px; margin: 4px auto; border-radius: 50%; display: grid; place-items: center; --p: 1;
  background: conic-gradient(var(--accent2) calc(var(--p) * 360deg), rgba(255,255,255,.1) 0); }
.ring span { width: 128px; height: 128px; border-radius: 50%; background: var(--panel-solid); display: grid; place-items: center; font-family: var(--f-display); font-size: 54px; }
.help-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.help-list li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; }
.help-list .sw { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 25%, transparent); color: var(--c); border: 1px solid var(--c); }
.help-list .sw svg { width: 18px; height: 18px; }
.muted { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; text-align: center; }

/* ---------- phone ---------- */
@media (max-width: 820px) {
  #menu { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto auto auto; gap: 12px;
    background: linear-gradient(180deg, rgba(5, 4, 14, .75), transparent 30%, transparent 50%, rgba(5, 4, 14, .85) 75%); }
  .brand .cn { font-size: 26px; }
  .brand .en { display: none; }
  .city-head { grid-row: 2; }
  .best-row .chip:nth-child(2) { display: none; }
  .side { grid-column: 1; grid-row: 4; }
  .missions { display: none; }
  .city-nav { grid-row: 5; gap: 8px; }
  .city-nav .arrow { width: 32px; height: 56px; }
  .city { min-height: 96px; padding: 12px 9px 10px; }
  .city .en { font-size: 8.5px; letter-spacing: .1em; }   /* PITTSBURGH, SAN FRANCISCO: the longest word fits a phone's card */
  .city.long .cn { font-size: 18px; }
  .city.mid .cn { font-size: 17px; }   /* three characters (匹兹堡, 莫斯科) on one line */
  .city.long .en { letter-spacing: .1em; }
  .play-wrap { grid-column: 1; grid-row: 6; }
  .keys { display: none; }
  .panel { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { .toast, .city-banner.go, .record, .chase-warn.on, .pw.ending { animation-duration: .01s; animation-iteration-count: 1; } .city-track.anim { transition-duration: .01s; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>

<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="loading" class="screen">
    <div class="logo">城市酷跑<small>CITY DASH</small></div>
    <div class="bar"><i id="loadBar"></i></div>
    <p id="loadMsg">正在搭建城市…</p>
  </div>

  <div id="menu" class="screen" hidden>
    <div class="menu-top">
      <div class="brand"><span class="cn">城市酷跑</span><span class="en">CITY DASH</span></div>
      <span class="chip" title="金币"><span class="coin-ico"></span><span id="menuCoins">0</span></span>
      <div class="tools">
        <button id="btnSound" class="icon-btn" aria-label="音效开关"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
        <button id="btnMusic" class="icon-btn" aria-label="音乐开关"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
        <button id="btnQuality" class="icon-btn" aria-label="画质切换"><b id="qLabel" style="font-size:12px">高</b></button>
        <button id="btnHelp" class="icon-btn" aria-label="玩法说明"><b style="font-size:18px">?</b></button>
      </div>
    </div>
    <div class="city-head">
      <div class="en" id="cityEn">NEW YORK</div>
      <div class="cn" id="cityCn">纽约 · 不夜城</div>
      <div class="best-row">
        <span class="chip"><span class="label">最高分</span><span id="bestScore">0</span></span>
        <span class="chip"><span class="label">倍率</span><span id="baseMult">×1</span></span>
      </div>
    </div>
    <div class="side">
      <div class="panel">
        <div class="char-row">
          <button id="charPrev" class="arrow" aria-label="上一个角色">‹</button>
          <div class="char-meta"><div id="charName">阿杰</div><div id="charDesc"></div></div>
          <button id="charNext" class="arrow" aria-label="下一个角色">›</button>
        </div>
        <div class="dots" id="charDots"></div>
        <button id="charBuy" class="btn" hidden></button>
      </div>
      <div class="panel missions">
        <h3>任务 <span id="missionInfo"></span></h3>
        <div id="missionList"></div>
      </div>
    </div>
    <div class="city-nav">
      <button id="cityPrev" class="arrow" aria-label="上一组城市">‹</button>
      <nav id="cities" class="cities" aria-label="选择城市"></nav>
      <button id="cityNext" class="arrow" aria-label="下一组城市">›</button>
    </div>
    <div class="play-wrap">
      <button id="playBtn" class="btn primary">开始奔跑</button>
      <div class="keys"><kbd>←</kbd><kbd>→</kbd> 换道 <kbd>↑</kbd> 跳 <kbd>↓</kbd> 滑铲 <kbd>P</kbd> 暂停 · 手机滑动操作</div>
    </div>
  </div>

  <div id="hud" hidden>
    <div class="hud-top">
      <button id="pauseBtn" class="icon-btn" aria-label="暂停"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <div class="score-box">
        <div id="score">0</div>
        <div class="score-sub"><span class="chip" id="mult">×1</span><span class="chip" id="dist">0 m</span></div>
        <div class="coin-box"><span class="chip"><span class="coin-ico"></span><span id="coins">0</span></span></div>
      </div>
    </div>
    <div id="powers" class="powers"></div>
    <div id="toasts" class="toasts"></div>
    <div id="cityBanner" class="city-banner"></div>
    <div id="chaseWarn" class="chase-warn">保安追上来了！别再撞了</div>
    <div id="hint" class="hint"></div>
    <div id="place" class="place"></div>
    <div id="hitVig" class="vignette-hit"></div>
  </div>

  <div id="pause" class="screen modal" hidden>
    <div class="sheet">
      <h2>暂停<small>PAUSED</small></h2>
      <button id="resumeBtn" class="btn primary">继续</button>
      <div class="row"><button id="restartBtn" class="btn">重新开始</button><button id="quitBtn" class="btn">主菜单</button></div>
    </div>
  </div>

  <div id="revive" class="screen modal" hidden>
    <div class="sheet">
      <h2 id="reviveTitle">撞车了！<small>CONTINUE?</small></h2>
      <div class="ring" id="reviveRing"><span id="reviveCount">5</span></div>
      <button id="reviveBtn" class="btn primary"></button>
      <button id="skipBtn" class="btn">放弃</button>
    </div>
  </div>

  <div id="over" class="screen modal" hidden>
    <div class="sheet">
      <h2 id="overTitle">游戏结束<small>GAME OVER</small></h2>
      <div id="newRecord" class="record" hidden>新纪录！</div>
      <div class="stats">
        <div class="stat big"><span class="label">得分</span><b id="oScore">0</b></div>
        <div class="stat"><span class="label">距离</span><b id="oDist">0</b></div>
        <div class="stat"><span class="label">金币</span><b id="oCoins">0</b></div>
        <div class="stat"><span class="label">最高分</span><b id="oBest">0</b></div>
        <div class="stat"><span class="label">惊险闪避</span><b id="oNear">0</b></div>
      </div>
      <div class="row"><button id="againBtn" class="btn primary">再跑一次</button><button id="menuBtn" class="btn">换个城市</button></div>
    </div>
  </div>

  <div id="help" class="screen modal" hidden>
    <div class="sheet">
      <h2>怎么玩<small>HOW TO PLAY</small></h2>
      <ul class="help-list" id="helpList"></ul>
      <p class="muted">迎面撞上障碍会直接结束；侧面擦碰会被保安追上，短时间内再撞一次就会被抓。顺着坡道可以跑上列车顶。</p>
      <button id="helpClose" class="btn primary">明白了</button>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
